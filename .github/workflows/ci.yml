name: CI
on:
  push:
    branches: [main]
  pull_request:

# Revue de sécurité 2026-11 (C-10, CHK-DEP-02) : jeton GITHUB_TOKEN en lecture seule ; actions épinglées par SHA
# de commit (une étiquette peut être déplacée). Mise à jour : Dependabot (package-ecosystem github-actions).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
